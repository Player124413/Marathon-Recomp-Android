name: build-android-apk

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      # ── Submodules (manual — skips private/unreachable ones) ─────────────────
      # MarathonRecompResources is private and not needed for Android builds.
      # MoltenVK is macOS-only. We init everything else, then recurse into the
      # recomp tool submodules which each have their own nested dependencies.
      - name: Initialize top-level submodules
        run: |
          git submodule update --init --depth 1 \
            tools/XenonRecomp \
            tools/XenosRecomp \
            thirdparty/vcpkg \
            thirdparty/SDL \
            thirdparty/SDL_mixer \
            thirdparty/imgui \
            thirdparty/implot \
            thirdparty/ddspp \
            thirdparty/msdf-atlas-gen \
            thirdparty/stb \
            thirdparty/concurrentqueue \
            thirdparty/magic_enum \
            thirdparty/nativefiledialog-extended \
            thirdparty/unordered_dense \
            thirdparty/json \
            thirdparty/plume \
            thirdparty/ffmpeg-core

      - name: Initialize XenosRecomp nested submodules
        run: |
          git -C tools/XenosRecomp submodule update --init --depth 1 \
            thirdparty/dxc-bin \
            thirdparty/smol-v \
            thirdparty/zstd \
            thirdparty/xxHash \
            thirdparty/fmt

      - name: Initialize XenonRecomp nested submodules
        run: |
          git -C tools/XenonRecomp submodule update --init --depth 1 \
            thirdparty/xxHash \
            thirdparty/fmt \
            thirdparty/tomlplusplus \
            thirdparty/libmspack \
            thirdparty/tiny-AES-c \
            thirdparty/simde

      # ── System dependencies ─────────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ninja-build \
            cmake \
            clang \
            patchelf \
            unzip \
            curl \
            openjdk-17-jdk

      # ── Android NDK ─────────────────────────────────────────────────────────
      - name: Cache Android NDK r27c
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: .ndk-tools/android-ndk-r27c
          key: android-ndk-r27c

      - name: Download Android NDK r27c
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ndk-tools
          curl -sL -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q /tmp/ndk.zip -d .ndk-tools
          rm /tmp/ndk.zip
          echo "NDK extracted to .ndk-tools/android-ndk-r27c"

      # ── Android SDK cmdline-tools ────────────────────────────────────────────
      - name: Cache Android SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: |
            .ndk-tools/android-sdk/cmdline-tools
            .ndk-tools/android-sdk/platforms
            .ndk-tools/android-sdk/build-tools
          key: android-sdk-platform34-buildtools34

      # ── vcpkg packages ───────────────────────────────────────────────────────
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ./thirdparty/vcpkg/downloads
            ./thirdparty/vcpkg/packages
            ./out/build/android-debug/vcpkg_installed
          key: vcpkg-android-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-android-

      # ── Gradle cache ─────────────────────────────────────────────────────────
      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android-apk/**/*.gradle*', 'android-apk/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      # ── Build .so files ──────────────────────────────────────────────────────
      - name: Build native library (.so files)
        run: bash build-android.sh

      # ── Copy .so files into jniLibs for Gradle packaging ─────────────────────
      - name: Package .so files into APK staging directory
        run: |
          JNI_DIR="android-apk/app/jniLibs/arm64-v8a"
          mkdir -p "$JNI_DIR"
          # build-android.sh already copies libmain.so here; verify and report
          if [[ -f "$JNI_DIR/libmain.so" ]]; then
            BYTES="$(stat -c '%s' "$JNI_DIR/libmain.so")"
            SHA="$(sha256sum "$JNI_DIR/libmain.so" | awk '{print $1}')"
            echo "✔ libmain.so ready for packaging: ${BYTES} bytes"
            echo "  SHA-256: $SHA"
          else
            echo "✘ libmain.so not found in $JNI_DIR — build-android.sh may have failed"
            exit 1
          fi
          # Copy any additional .so files produced alongside libmain.so
          BUILT_DIR="$(find out/build/android-debug -name 'libmain.so' -printf '%h\n' 2>/dev/null | head -1)"
          if [[ -n "$BUILT_DIR" ]]; then
            for so in "$BUILT_DIR"/*.so; do
              [[ -f "$so" ]] || continue
              NAME="$(basename "$so")"
              if [[ "$NAME" != "libmain.so" ]]; then
                cp "$so" "$JNI_DIR/$NAME"
                echo "  + $NAME"
              fi
            done
          fi

      # ── Build APK ────────────────────────────────────────────────────────────
      - name: Build APK
        run: bash build-apk.sh --skip-native

      # ── Upload artifacts ─────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-Android-debug
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload libmain.so
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-Android-libmain
          path: android-apk/app/jniLibs/arm64-v8a/libmain.so
          if-no-files-found: warn
