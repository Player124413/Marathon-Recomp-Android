def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
} else {
    apply plugin: 'com.android.library'
}

android {
    if (buildAsApplication) {
        namespace "org.libsdl.app"
    }
    compileSdkVersion 34
    ndkVersion "27.2.12479018"
    defaultConfig {
        if (buildAsApplication) {
            applicationId "com.sega.sonic2006"
        }
        minSdkVersion 28
        targetSdkVersion 34
        versionCode 8
        versionName "1.0.6-android-diag3"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // The real libmain.so comes from the top-level CMake build (MarathonRecomp's
    // ANDROID branch builds the whole game + SDL2 as a single shared library
    // named "main"), run out-of-Gradle via build-android.sh and copied into
    // jniLibs/ below. The jni/ directory's own ndkBuild project is a leftover
    // placeholder from before that integration (its main.c just prints an error
    // stub) and is intentionally NOT wired up here - building it too would
    // produce a second, conflicting libmain.so.
    sourceSets {
        main {
            jniLibs.srcDirs = ['jniLibs']
            java.srcDirs = ['src/main/java']
            manifest.srcFile 'src/main/AndroidManifest.xml'
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Legacy (extracted-to-disk) native lib packaging is required for custom
    // Turnip driver loading: libadrenotools dlopen's its hook libraries
    // (libmain_hook.so / libhook_impl.so) from ApplicationInfo.nativeLibraryDir
    // on disk, which only exists with real files when libs are extracted rather
    // than mapped directly from the (compressed) APK zip.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // CI provides the release keystore through environment variables (see
    // .github/workflows/android.yml); local release builds stay unsigned.
    if (System.getenv("ANDROID_KEYSTORE_FILE") != null) {
        signingConfigs {
            ci {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.ci
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // DocumentFile.fromTreeUri, used by LauncherActivity to walk the SAF-picked
    // game-dump folder when copying it into app-specific storage.
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
