name: build-android-apk

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug, release, both)'
        required: false
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: write   # create releases + push tags
  issues: write     # post build diagnostics on failure

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.build_type || 'release' }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK (${{ github.event.inputs.build_type || 'release' }})
    runs-on: ubuntu-24.04

    env:
      # Force vcpkg to use system cmake/ninja instead of downloading its own
      # binaries, which fail with "Could not find CMAKE_ROOT" on GitHub Actions.
      VCPKG_FORCE_SYSTEM_BINARIES: 1
      # Log file all long steps append to; uploaded as an artifact and posted
      # to a tracking issue so failures can be diagnosed without log access.
      BUILD_LOG: ${{ github.workspace }}/build-logs/build.log
      # Use ccache for every CMake configure (host tools + android target) so
      # repeated CI runs don't recompile the 169 MB of generated PPC sources.
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      # ── System dependencies ─────────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ninja-build \
            cmake \
            clang \
            ccache \
            patchelf \
            unzip \
            zip \
            curl \
            pkg-config \
            autoconf \
            automake \
            autoconf-archive \
            libtool \
            bison \
            flex \
            gettext \
            texinfo \
            gperf \
            openjdk-17-jdk
          echo "ninja: $(which ninja)"
          ninja --version
          ccache --version
          mkdir -p "$(dirname "$BUILD_LOG")"
          echo "=== build started $(date -u) ===" > "$BUILD_LOG"
          echo "build_type input: ${{ github.event.inputs.build_type || 'release' }}"

      # ── dxc-bin binaries (lib/x64 and bin/x64 not committed) ────────────────
      # build-android.sh now also auto-fetches this if missing, but keep this
      # step for CI speed (pre-populates cache before cmake configure).
      - name: Fetch dxc-bin binaries
        run: |
          if [[ -f "tools/XenosRecomp/thirdparty/dxc-bin/lib/x64/libdxcompiler.so" ]]; then
            echo "dxc-bin already present, skipping fetch"
            ls -lh "tools/XenosRecomp/thirdparty/dxc-bin/lib/x64/" "tools/XenosRecomp/thirdparty/dxc-bin/bin/x64/" || true
            exit 0
          fi
          git clone --depth=1 https://github.com/renderbag/dxc-bin.git /tmp/dxc-bin
          DXC_DEST="tools/XenosRecomp/thirdparty/dxc-bin"
          mkdir -p "$DXC_DEST/lib/x64" "$DXC_DEST/bin/x64"
          cp /tmp/dxc-bin/lib/x64/libdxcompiler.so "$DXC_DEST/lib/x64/"
          cp /tmp/dxc-bin/lib/x64/libdxil.so       "$DXC_DEST/lib/x64/"
          cp /tmp/dxc-bin/bin/x64/dxc-linux        "$DXC_DEST/bin/x64/"
          chmod +x "$DXC_DEST/bin/x64/dxc-linux"
          ls -lh "$DXC_DEST/lib/x64/" "$DXC_DEST/bin/x64/"

      # ── ccache restore ──────────────────────────────────────────────────────
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-android-${{ github.event.inputs.build_type || 'release' }}-${{ github.sha }}
          restore-keys: |
            ccache-android-${{ github.event.inputs.build_type || 'release' }}-
            ccache-android-

      # ── Android NDK ─────────────────────────────────────────────────────────
      - name: Cache Android NDK r27c
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: .ndk-tools/android-ndk-r27c
          key: android-ndk-r27c

      - name: Download Android NDK r27c
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ndk-tools
          curl -sL -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q /tmp/ndk.zip -d .ndk-tools
          rm /tmp/ndk.zip

      # ── Android SDK cmdline-tools ────────────────────────────────────────────
      - name: Cache Android SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: |
            .ndk-tools/android-sdk/cmdline-tools
            .ndk-tools/android-sdk/platforms
            .ndk-tools/android-sdk/build-tools
          key: android-sdk-platform34-buildtools34

      # ── vcpkg packages ───────────────────────────────────────────────────────
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ./thirdparty/vcpkg/downloads
            ./thirdparty/vcpkg/packages
            ./out/build/android-debug/vcpkg_installed
            ./out/build/android-release/vcpkg_installed
          key: vcpkg-android-${{ hashFiles('vcpkg.json', 'triplets/overlay/*') }}
          restore-keys: |
            vcpkg-android-

      # ── Gradle cache ─────────────────────────────────────────────────────────
      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android-apk/**/*.gradle*', 'android-apk/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      # ── Determine build type ─────────────────────────────────────────────────
      - name: Determine build type
        id: build-type
        run: |
          INPUT="${{ github.event.inputs.build_type || 'release' }}"
          echo "input=$INPUT"
          if [[ "$INPUT" == "both" ]]; then
            echo "build_debug=true" >> $GITHUB_OUTPUT
            echo "build_release=true" >> $GITHUB_OUTPUT
          elif [[ "$INPUT" == "debug" ]]; then
            echo "build_debug=true" >> $GITHUB_OUTPUT
            echo "build_release=false" >> $GITHUB_OUTPUT
          else
            echo "build_debug=false" >> $GITHUB_OUTPUT
            echo "build_release=true" >> $GITHUB_OUTPUT
          fi

      # ── Build .so files (Debug) ──────────────────────────────────────────────
      - name: Build native library DEBUG
        id: build-native-debug
        if: steps.build-type.outputs.build_debug == 'true'
        run: |
          set -o pipefail
          bash build-android.sh 2>&1 | tee -a "$BUILD_LOG"

      # ── Build .so files (Release) ────────────────────────────────────────────
      - name: Build native library RELEASE
        id: build-native-release
        if: steps.build-type.outputs.build_release == 'true'
        run: |
          set -o pipefail
          # For CI release, always clean previous debug staging to avoid mixing
          rm -rf android-apk/app/jniLibs
          bash build-android.sh --release 2>&1 | tee -a "$BUILD_LOG"

      # ── Diagnose failure via tracking issue ─────────────────────────────────
      - name: Post failure diagnostics to issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE=/tmp/issue-body.md
          {
            echo "Run: [$GITHUB_RUN_ID ($GITHUB_EVENT_NAME)]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo ""
            echo "Commit: \`$GITHUB_SHA\` (\`$GITHUB_REF_NAME\`)"
            echo "Build type: ${{ github.event.inputs.build_type || 'release' }}"
            echo ""
            echo '```'
            tail -c 30000 "$BUILD_LOG" | sed 's/\r//g'
            echo '```'
          } > "$BODY_FILE"
          ISSUE_URL="$(gh issue list --state open --search 'CI build diagnostics' --json url,title -q '.[0].url' || true)"
          if [ -n "$ISSUE_URL" ]; then
            gh issue comment "$ISSUE_URL" --body-file "$BODY_FILE"
          else
            gh issue create --title "CI build diagnostics" --body-file "$BODY_FILE"
          fi

      # Always upload the build log for debugging.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-Android-build-log-${{ github.event.inputs.build_type || 'release' }}
          path: build-logs/build.log
          if-no-files-found: ignore

      # ── Build APK (Debug) ────────────────────────────────────────────────────
      - name: Package .so files into APK staging (Debug)
        if: steps.build-type.outputs.build_debug == 'true'
        run: |
          # Debug build already staged by build-android.sh into jniLibs
          JNI_DIR="android-apk/app/jniLibs/arm64-v8a"
          if [[ ! -f "$JNI_DIR/libmain.so" ]]; then
            echo "DEBUG: libmain.so not found in $JNI_DIR — trying to copy from out/build/android-debug"
            mkdir -p "$JNI_DIR"
            BUILT="$(find out/build/android-debug -name 'libmain.so' -type f 2>/dev/null | head -1)"
            if [[ -n "$BUILT" ]]; then
              cp "$BUILT" "$JNI_DIR/libmain.so"
              for so in "$(dirname "$BUILT")"/*.so; do
                [[ -f "$so" ]] || continue
                NAME="$(basename "$so")"
                [[ "$NAME" != "libmain.so" ]] && cp "$so" "$JNI_DIR/$NAME" && echo "  + $NAME"
              done
            else
              echo "No debug libmain.so found, APK will be launcher-only"
            fi
          fi
          ls -lh "$JNI_DIR" || true

      - name: Build APK DEBUG
        id: build-apk-debug
        if: steps.build-type.outputs.build_debug == 'true'
        run: |
          set -o pipefail
          bash build-apk.sh --skip-native 2>&1 | tee -a "$BUILD_LOG"

      # ── Build APK (Release) ──────────────────────────────────────────────────
      - name: Package .so files into APK staging (Release)
        if: steps.build-type.outputs.build_release == 'true'
        run: |
          # For release, the .so was staged by build-android.sh --release into the same jniLibs dir
          # If we just built both, debug step may have overwritten; re-stage release version
          if [[ "${{ steps.build-type.outputs.build_debug }}" == "true" ]]; then
            # Both requested: need to re-stage release .so after debug build overwrote it
            rm -rf android-apk/app/jniLibs
            mkdir -p android-apk/app/jniLibs/arm64-v8a
            BUILT_DIR="$(find out/build/android-release -name 'libmain.so' -type f -printf '%h\n' 2>/dev/null | head -1)"
            if [[ -n "$BUILT_DIR" ]]; then
              cp "$BUILT_DIR/libmain.so" android-apk/app/jniLibs/arm64-v8a/libmain.so
              for so in "$BUILT_DIR"/*.so; do
                [[ -f "$so" ]] || continue
                NAME="$(basename "$so")"
                [[ "$NAME" != "libmain.so" ]] && cp "$so" "android-apk/app/jniLibs/arm64-v8a/$NAME" && echo "  + $NAME"
              done
            fi
          fi
          ls -lh android-apk/app/jniLibs/arm64-v8a/ || true

      - name: Build APK RELEASE
        id: build-apk-release
        if: steps.build-type.outputs.build_release == 'true'
        run: |
          set -o pipefail
          bash build-apk.sh --release --skip-native 2>&1 | tee -a "$BUILD_LOG"

      # ── Upload artifacts ─────────────────────────────────────────────────────
      - name: Upload APK DEBUG
        if: steps.build-type.outputs.build_debug == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-Android-debug
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload APK RELEASE
        if: steps.build-type.outputs.build_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-Android-release
          path: |
            android-apk/app/build/outputs/apk/release/app-release.apk
            android-apk/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload libmain.so DEBUG
        if: steps.build-type.outputs.build_debug == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-Android-libmain-debug
          path: out/build/android-debug/MarathonRecomp/libmain.so
          if-no-files-found: warn

      - name: Upload libmain.so RELEASE
        if: steps.build-type.outputs.build_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-Android-libmain-release
          path: out/build/android-release/MarathonRecomp/libmain.so
          if-no-files-found: warn

